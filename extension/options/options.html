<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Mailtrack Settings</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #202124;
    }
    h1 {
      font-size: 22px;
      color: #1a73e8;
      border-bottom: 2px solid #f1f3f4;
      padding-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .help-text {
      font-size: 12px;
      color: #5f6368;
      margin-top: 4px;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }
    .btn-save {
      background-color: #1a73e8;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 500;
      border-radius: 4px;
      cursor: pointer;
    }
    .save-alert {
      display: none;
      margin-top: 16px;
      padding: 10px;
      background-color: #e6f4ea;
      color: #137333;
      border-radius: 4px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <h1><span>✓✓</span> Personal Mailtrack Settings</h1>

  <form id="settings-form">
    <div class="form-group">
      <label for="api-url">Backend API Base URL</label>
      <input type="text" id="api-url" required>
      <div class="help-text">Default: http://localhost:8000 (no custom domain required)</div>
    </div>

    <div class="form-group">
      <label for="tracking-url">Tracking Endpoint Base URL</label>
      <input type="text" id="tracking-url" required>
      <div class="help-text">Domain or host where pixels and link redirects are served.</div>
    </div>

    <div class="form-group">
      <label for="timeout-ms">Tracking Preparation Timeout (ms)</label>
      <input type="number" id="timeout-ms" min="500" max="10000" step="100" required>
      <div class="help-text">Fail-open safety timeout before sending email natively (default: 2500ms).</div>
    </div>

    <button type="submit" class="btn-save">Save Settings</button>
    <div id="save-alert" class="save-alert">Settings saved successfully!</div>
  </form>

  <script type="module" src="options.js"></script>
</body>
</html>
