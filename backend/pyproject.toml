[project]
name = "personal-mailtrack"
version = "0.1.0"
description = "Personal Mailtrack / Mailsuite-style email productivity suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.34",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.3.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110", "ASYNC230"]

# ADD THIS SECTION TO FIX THE ERROR
[tool.setuptools]
packages = ["app", "storage", "supabase"] 